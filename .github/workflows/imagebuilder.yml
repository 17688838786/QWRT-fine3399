name: ImageBuilder 快速打包

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要包含的额外软件包（空格分隔，基础包已默认包含）'
        required: false
        default: ''
      imagebuilder_version:
        description: 'ImageBuilder 版本（留空使用最新 Release）'
        required: false
        default: ''

env:
  REPO: 17688838786/QWRT-fine3399
  TARGET: rockchip/armv8
  PROFILE: rumu3f_fine-3399

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检查可用空间
        run: |
          df -h
          echo "可用空间: $(df -h / | tail -1 | awk '{print $4}')"

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget xz-utils

      - name: 获取最新 Release 信息
        id: release
        run: |
          if [ -n "${{ github.event.inputs.imagebuilder_version }}" ]; then
            TAG="${{ github.event.inputs.imagebuilder_version }}"
          else
            TAG=$(curl -s "https://api.github.com/repos/${{ env.REPO }}/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "使用 Release: $TAG"
          
          # 获取 ImageBuilder 下载链接
          IB_URL=$(curl -s "https://api.github.com/repos/${{ env.REPO }}/releases/tags/$TAG" | grep -o '"browser_download_url": *"[^"]*imagebuilder[^"]*"' | head -1 | sed 's/.*"browser_download_url": *"\([^"]*\)".*/\1/')
          echo "ib_url=$IB_URL" >> $GITHUB_OUTPUT
          echo "ImageBuilder: $IB_URL"
          
          # 获取软件包下载链接（如果有）
          PACKAGES_URL=$(curl -s "https://api.github.com/repos/${{ env.REPO }}/releases/tags/$TAG" | grep -o '"browser_download_url": *"[^"]*packages[^"]*"' | head -1 | sed 's/.*"browser_download_url": *"\([^"]*\)".*/\1/')
          echo "packages_url=$PACKAGES_URL" >> $GITHUB_OUTPUT
          echo "Packages: $PACKAGES_URL"

      - name: 下载 ImageBuilder
        run: |
          echo "下载 ImageBuilder..."
          wget -q --show-progress -O imagebuilder.tar.xz "${{ steps.release.outputs.ib_url }}"
          ls -lh imagebuilder.tar.xz

      - name: 解压 ImageBuilder
        run: |
          tar -xf imagebuilder.tar.xz
          IB_DIR=$(ls -d openwrt-imagebuilder-* 2>/dev/null | head -1)
          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV
          echo "ImageBuilder 目录: $IB_DIR"
          ls -la "$IB_DIR"

      - name: 下载额外软件包（如果有）
        if: steps.release.outputs.packages_url != ''
        run: |
          echo "下载软件包..."
          wget -q --show-progress -O packages.tar.gz "${{ steps.release.outputs.packages_url }}"
          mkdir -p packages
          tar -xzf packages.tar.gz -C packages || true
          ls -la packages/ || true
          
          # 配置本地软件包源
          IB_DIR="${{ env.IB_DIR }}"
          if [ -d packages/packages ]; then
            echo "src/gz local file://$(pwd)/packages/packages" >> "$IB_DIR/repositories.conf"
            echo "已添加本地软件包源"
          fi

      - name: 配置软件包列表
        run: |
          IB_DIR="${{ env.IB_DIR }}"
          
          # 基础软件包（必选）
          BASE_PACKAGES="luci luci-i18n-base-zh-cn luci-theme-argon \
            kmod-ath11k-ahb kmod-ath11k-pci ath11k-firmware-qcn6855 \
            kmod-usb-net-qmi-wwan kmod-usb-serial-option kmod-usb-serial-qualcomm \
            kmod-fs-ext4 kmod-fs-vfat kmod-fs-ntfs3 \
            block-mount e2fsprogs dosfstools ntfs3-mount \
            curl wget nano htop iftop iperf3 \
            ca-certificates ca-bundle openssl-util \
            zoneinfo-asia"
          
          # 用户指定的额外软件包
          EXTRA_PACKAGES="${{ github.event.inputs.packages }}"
          
          ALL_PACKAGES="$BASE_PACKAGES $EXTRA_PACKAGES"
          
          echo "软件包列表:"
          echo "$ALL_PACKAGES" | tr ' ' '\n'
          
          echo "packages=$ALL_PACKAGES" >> $GITHUB_ENV

      - name: 生成固件
        run: |
          IB_DIR="${{ env.IB_DIR }}"
          cd "$IB_DIR"
          
          echo "开始生成固件..."
          echo "目标: ${{ env.PROFILE }}"
          echo "软件包数量: $(echo ${{ env.packages }} | wc -w)"
          
          make image PROFILE="${{ env.PROFILE }}" PACKAGES="${{ env.packages }}" 2>&1 | tail -50
          
          echo ""
          echo "生成的文件:"
          find bin/targets -name "*.img*" -o -name "*.tar.gz" | head -20

      - name: 检查生成结果并复制产物
        run: |
          IB_DIR="${{ env.IB_DIR }}"
          echo "工作目录: $(pwd)"
          echo "IB_DIR: $IB_DIR"
          
          mkdir -p output
          
          echo ""
          echo "=== 生成目录内容 ==="
          find "$IB_DIR/bin" -type f -name "*.img*" -o -name "*.tar.gz" -o -name "*.manifest" 2>/dev/null | head -30
          
          echo ""
          echo "=== 复制产物到 output 目录 ==="
          find "$IB_DIR/bin/targets" -type f \( -name "*.img.gz" -o -name "*rootfs*.tar.gz" -o -name "*.manifest" \) -exec cp -v {} output/ \; 2>/dev/null || true
          
          echo ""
          echo "=== output 目录内容 ==="
          ls -lh output/
          echo "文件数量: $(ls output/ | wc -l)"

      - name: 上传固件产物
        uses: actions/upload-artifact@v3
        with:
          name: OpenWrt_firmware_${{ env.PROFILE }}
          path: output/
          retention-days: 30

      - name: 生成完成
        run: |
          echo "========================================"
          echo "  ImageBuilder 固件打包完成！"
          echo "========================================"
          echo ""
          echo "目标设备: ${{ env.PROFILE }}"
          echo "Release版本: ${{ steps.release.outputs.tag }}"
          echo ""
          echo "固件已上传到 Artifacts"
          echo "下载地址: https://github.com/${{ env.REPO }}/actions/runs/${{ github.run_id }}"
