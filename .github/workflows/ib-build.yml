name: ImageBuilder Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Create test file
        run: |
          mkdir -p output
          echo "test" > output/test.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: output/
          retention-days: 30