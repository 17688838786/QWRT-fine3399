name: ImageBuilder Build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xz-utils

      - name: Debug targetinfo
        run: |
          TAG=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          IB_URL=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/tags/$TAG" | grep -o '"browser_download_url": *"[^"]*imagebuilder[^"]*"' | head -1 | sed 's/.*"browser_download_url": *"\([^"]*\)".*/\1/')
          wget -q -O ib.tar.xz "$IB_URL"
          tar -xf ib.tar.xz
          IB_DIR=$(ls -d openwrt-imagebuilder-* | head -1)
          cd "$IB_DIR"

          echo "=== .targetinfo full content for rumu3f ==="
          grep -A 50 "rumu3f" .targetinfo || true
          echo ""

          echo "=== .targetinfo first 30 lines (format) ==="
          head -30 .targetinfo
          echo ""

          echo "=== How ImageBuilder generates device defs ==="
          grep -rn "targetinfo\|TargetInfo\|DEVICE_INFO\|json_add" include/ scripts/ 2>/dev/null | grep -v ".pyc" | head -20
          echo ""

          echo "=== Check bin/targets after make info ==="
          make info > /dev/null 2>&1 || true
          find bin/targets -type f 2>/dev/null | head -20
          echo ""

          echo "=== Check if profiles dir created after make info ==="
          find bin/targets -name "profiles" -type d 2>/dev/null
          find bin/targets -name "*.json" 2>/dev/null | head -10
          echo ""

          echo "=== include/image.mk device generation ==="
          grep -n "TargetInfo\|targetinfo\|DEVICE_ID\|DEVICE_TITLE\|define Device\|eval.*Device" include/image.mk 2>/dev/null | head -30
          echo ""

          mkdir -p ../output
          cp .targetinfo ../output/ 2>/dev/null || true
          echo "done" > ../output/done.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_debug
          path: output/
          retention-days: 7
