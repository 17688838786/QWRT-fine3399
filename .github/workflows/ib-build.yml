name: ImageBuilder Build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xz-utils

      - name: Build firmware
        run: |
          TAG=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          echo "Release: $TAG"
          IB_URL=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/tags/$TAG" | grep -o '"browser_download_url": *"[^"]*imagebuilder[^"]*"' | head -1 | sed 's/.*"browser_download_url": *"\([^"]*\)".*/\1/')
          echo "IB: $IB_URL"
          wget -q -O ib.tar.xz "$IB_URL"
          ls -lh ib.tar.xz
          tar -xf ib.tar.xz
          IB_DIR=$(ls -d openwrt-imagebuilder-* | head -1)
          echo "IB_DIR: $IB_DIR"
          cd "$IB_DIR"

          echo "=== Inject JSON profile ==="
          mkdir -p target/linux/rockchip/armv8/profiles
          mkdir -p bin/targets/rockchip/armv8/profiles
          cat > target/linux/rockchip/armv8/profiles/rumu3f_fine-3399.json << 'JSONEOF'
          {
            "id": "rumu3f_fine-3399",
            "target": "rockchip/armv8",
            "images": [
              {
                "name": "openwrt-rockchip-armv8-rumu3f_fine-3399-squashfs-sysupgrade.img.gz",
                "type": "sysupgrade",
                "filesystem": "squashfs"
              }
            ],
            "device_packages": [
              "brcmfmac-firmware-43430b0-sdio",
              "brcmfmac-nvram-43430b0-sdio",
              "kmod-brcmfmac",
              "kmod-gpio-button-hotplug",
              "kmod-usb-net-rtl8152",
              "wpad",
              "iwinfo"
            ],
            "supported_devices": ["rumu3f,fine-3399"],
            "title": "RUMU3F FINE 3399"
          }
          JSONEOF
          cp target/linux/rockchip/armv8/profiles/rumu3f_fine-3399.json bin/targets/rockchip/armv8/profiles/
          echo "JSON files created:"
          find . -name "*.json" 2>/dev/null
          echo ""

          echo "=== Building ==="
          PKGS="luci luci-i18n-base-zh-cn luci-theme-argon curl wget htop ca-certificates ca-bundle openssl-util -luci-app-accesscontrol -luci-app-filetransfer ${{ github.event.inputs.packages }}"
          echo "Packages: $PKGS"
          make image PROFILE="rumu3f_fine-3399" PACKAGES="$PKGS" > build.log 2>&1
          MAKE_EXIT=$?
          echo "=== Make exit code: $MAKE_EXIT ==="
          echo "=== Build log (last 150 lines) ==="
          tail -150 build.log
          echo "=== Generated files ==="
          find bin/targets -type f 2>&1
          mkdir -p ../output
          find bin/targets -type f -name "*.img.gz" -exec cp {} ../output/ \; 2>&1
          find bin/targets -type f -name "*rootfs*.tar.gz" -exec cp {} ../output/ \; 2>&1
          find bin/targets -type f -name "*.manifest" -exec cp {} ../output/ \; 2>&1
          cp build.log ../output/ 2>&1
          echo "=== Output files ==="
          ls -lh ../output/ 2>&1
          if [ $MAKE_EXIT -ne 0 ]; then
            echo "=== Build failed ==="
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: output/
          retention-days: 30
