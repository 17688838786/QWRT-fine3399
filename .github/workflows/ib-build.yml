name: ImageBuilder Build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xz-utils

      - name: Build firmware
        run: |
          set -x
          TAG=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          echo "Release: $TAG"
          IB_URL=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/tags/$TAG" | grep -o '"browser_download_url": *"[^"]*imagebuilder[^"]*"' | head -1 | sed 's/.*"browser_download_url": *"\([^"]*\)".*/\1/')
          echo "IB: $IB_URL"
          wget -q -O ib.tar.xz "$IB_URL"
          tar -xf ib.tar.xz
          IB_DIR=$(ls -d openwrt-imagebuilder-* | head -1)
          cd "$IB_DIR"

          echo "=== rockchip image Makefile ==="
          cat target/linux/rockchip/image/Makefile
          echo ""

          echo "=== Inject device definition ==="
          DEVFILE=/tmp/device-def.mk
          printf 'define Device/rumu3f_fine-3399\n' > "$DEVFILE"
          printf '  DEVICE_VENDOR := RUMU3F\n' >> "$DEVFILE"
          printf '  DEVICE_MODEL := FINE 3399\n' >> "$DEVFILE"
          printf '  SOC := rk3399\n' >> "$DEVFILE"
          printf '  DEVICE_DTS := rk3399-fine-3399\n' >> "$DEVFILE"
          printf '  UBOOT_DEVICE_NAME := fine3399-rk3399\n' >> "$DEVFILE"
          printf '  CUSTOM_UBOOT_DIR := $(TOPDIR)/files/uboot-custom\n' >> "$DEVFILE"
          printf '  IMAGE/sysupgrade.img.gz := boot-common | boot-script | custom-uboot-bin | gzip | append-metadata\n' >> "$DEVFILE"
          printf '  DEVICE_PACKAGES := brcmfmac-firmware-43430b0-sdio brcmfmac-nvram-43430b0-sdio kmod-brcmfmac kmod-gpio-button-hotplug kmod-usb-net-rtl8152 wpad iwinfo\n' >> "$DEVFILE"
          printf 'endef\n' >> "$DEVFILE"
          printf 'TARGET_DEVICES += rumu3f_fine-3399\n' >> "$DEVFILE"
          echo "Device definition:"
          cat "$DEVFILE"
          echo ""
          cat "$DEVFILE" >> target/linux/rockchip/image/armv8.mk
          echo "Appended to armv8.mk"
          echo ""

          echo "=== Setup custom uboot files ==="
          mkdir -p files/uboot-custom
          STAGING_IMG="staging_dir/target-aarch64_generic_musl/image"
          echo "Available uboot files in staging:"
          ls -la "$STAGING_IMG/" 2>/dev/null
          if [ -f "$STAGING_IMG/fine3399-rk3399-idbloader.img" ]; then
            cp "$STAGING_IMG/fine3399-rk3399-idbloader.img" files/uboot-custom/idbloader.img
            echo "Copied idbloader.img"
          fi
          if [ -f "$STAGING_IMG/fine3399-rk3399-u-boot.itb" ]; then
            cp "$STAGING_IMG/fine3399-rk3399-u-boot.itb" files/uboot-custom/u-boot.itb
            echo "Copied u-boot.itb"
          fi
          if [ -f "$STAGING_IMG/rk3399_bl31.elf" ]; then
            cp "$STAGING_IMG/rk3399_bl31.elf" files/uboot-custom/bl31.elf
            echo "Copied bl31.elf"
          fi
          echo "Custom uboot files:"
          ls -la files/uboot-custom/
          echo ""

          echo "=== Verify device in make info ==="
          make info 2>&1 | grep -A 10 "rumu3f_fine-3399"
          echo ""

          echo "=== Building ==="
          PKGS="luci luci-i18n-base-zh-cn luci-theme-argon curl wget htop ca-certificates ca-bundle openssl-util -luci-app-accesscontrol -luci-app-filetransfer ${{ github.event.inputs.packages }}"
          echo "Packages: $PKGS"
          make image PROFILE="rumu3f_fine-3399" PACKAGES="$PKGS" V=s > build.log 2>&1
          MAKE_EXIT=$?
          echo "=== Make exit code: $MAKE_EXIT ==="
          echo "=== Build log (last 200 lines) ==="
          tail -200 build.log

          echo "=== Inject custom files into rootfs ==="
          CUSTOM_DIR="$GITHUB_WORKSPACE/files"
          ROOTFS=$(find bin/targets -name "*rootfs*.tar.gz" | head -1)
          echo "RootFS: $ROOTFS"
          if [ -n "$ROOTFS" ]; then
            mkdir -p /tmp/rootfs_inject
            cd /tmp/rootfs_inject
            tar -xzf "$OLDPWD/$ROOTFS"
            echo "Extracted rootfs"
            # 复制自定义文件
            if [ -f "$CUSTOM_DIR/etc/init.d/gpio138" ]; then
              mkdir -p etc/init.d
              cp "$CUSTOM_DIR/etc/init.d/gpio138" etc/init.d/gpio138
              chmod +x etc/init.d/gpio138
              echo "Injected gpio138 init.d"
            fi
            if [ -f "$CUSTOM_DIR/etc/config/gpio138" ]; then
              mkdir -p etc/config
              cp "$CUSTOM_DIR/etc/config/gpio138" etc/config/gpio138
              echo "Injected gpio138 config"
            fi
            if [ -f "$CUSTOM_DIR/usr/bin/gpio138-ctl" ]; then
              mkdir -p usr/bin
              cp "$CUSTOM_DIR/usr/bin/gpio138-ctl" usr/bin/gpio138-ctl
              chmod +x usr/bin/gpio138-ctl
              echo "Injected gpio138-ctl"
            fi
            if [ -f "$CUSTOM_DIR/etc/uci-defaults/99-wifi-default" ]; then
              mkdir -p etc/uci-defaults
              cp "$CUSTOM_DIR/etc/uci-defaults/99-wifi-default" etc/uci-defaults/99-wifi-default
              chmod +x etc/uci-defaults/99-wifi-default
              echo "Injected 99-wifi-default"
            fi
            # 创建开机自启符号链接
            mkdir -p etc/rc.d
            ln -sf ../init.d/gpio138 etc/rc.d/S99gpio138
            echo "Created S99gpio138 symlink"
            echo "Custom files in rootfs:"
            find etc/init.d etc/config usr/bin etc/uci-defaults etc/rc.d -type f -o -type l 2>/dev/null
            # 重新打包
            echo "Repacking rootfs..."
            tar -czf /tmp/new_rootfs.tar.gz .
            cp /tmp/new_rootfs.tar.gz "$OLDPWD/$ROOTFS"
            echo "Repacked rootfs"
            cd "$OLDPWD"
          fi

          echo "=== Generated files ==="
          find bin/targets -type f 2>&1
          mkdir -p ../output
          find bin/targets -type f -name "*.img.gz" -exec cp {} ../output/ \; 2>&1
          find bin/targets -type f -name "*rootfs*.tar.gz" -exec cp {} ../output/ \; 2>&1
          find bin/targets -type f -name "*.manifest" -exec cp {} ../output/ \; 2>&1
          cp build.log ../output/ 2>&1
          echo "=== Output files ==="
          ls -lh ../output/ 2>&1
          if [ $MAKE_EXIT -ne 0 ]; then
            echo "=== Build failed ==="
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: output/
          retention-days: 30
