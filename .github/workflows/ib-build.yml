name: ImageBuilder Build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xz-utils

      - name: Build firmware
        run: |
          TAG=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          echo "Release: $TAG"
          IB_URL=$(curl -s "https://api.github.com/repos/17688838786/QWRT-fine3399/releases/tags/$TAG" | grep -o '"browser_download_url": *"[^"]*imagebuilder[^"]*"' | head -1 | sed 's/.*"browser_download_url": *"\([^"]*\)".*/\1/')
          echo "IB: $IB_URL"
          wget -q -O ib.tar.xz "$IB_URL"
          tar -xf ib.tar.xz
          IB_DIR=$(ls -d openwrt-imagebuilder-* | head -1)
          cd "$IB_DIR"

          echo "=== scripts directory ==="
          ls -la scripts/
          echo ""
          echo "=== json-related scripts ==="
          find scripts/ -name "*json*" -o -name "*image*" 2>/dev/null
          echo ""
          echo "=== json_add_image_info.py content (if exists) ==="
          cat scripts/json_add_image_info.py 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== grep JSON in include/image.mk ==="
          grep -n -i "json" include/image.mk 2>/dev/null | head -30
          echo ""
          echo "=== grep JSON in target/linux/rockchip/image/Makefile ==="
          cat target/linux/rockchip/image/Makefile
          echo ""
          echo "=== target/linux/rockchip/image/armv8.mk ==="
          cat target/linux/rockchip/image/armv8.mk
          echo ""
          echo "=== .config TARGET_ROOTFS_* ==="
          grep -E "TARGET_ROOTFS|CONFIG_TARGET_ROOTFS" .config | head -20
          echo ""
          echo "=== .config JSON related ==="
          grep -i "json" .config 2>/dev/null | head -10
          echo ""
          echo "=== make info for fine3399 ==="
          make info 2>&1 | grep -A 20 "rumu3f_fine-3399"
          echo ""
          echo "=== Build with V=s for verbose output ==="
          PKGS="luci luci-i18n-base-zh-cn luci-theme-argon -luci-app-accesscontrol -luci-app-filetransfer ${{ github.event.inputs.packages }}"
          make image PROFILE="rumu3f_fine-3399" PACKAGES="$PKGS" V=s > build_verbose.log 2>&1
          MAKE_EXIT=$?
          echo "Make exit: $MAKE_EXIT"
          echo "=== Build log - image building section ==="
          grep -n -i "building image\|json\|img\.gz\|rootfs\|mkfs\|dd if\|Image/Build" build_verbose.log | head -50
          echo ""
          echo "=== Build log last 80 lines ==="
          tail -80 build_verbose.log
          echo ""
          echo "=== Generated files ==="
          find bin/targets -type f 2>&1
          mkdir -p ../output
          find bin/targets -type f -name "*.img.gz" -exec cp {} ../output/ \; 2>&1
          find bin/targets -type f -name "*rootfs*.tar.gz" -exec cp {} ../output/ \; 2>&1
          cp build_verbose.log ../output/ 2>&1
          echo "=== Output ==="
          ls -lh ../output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: output/
          retention-days: 30
